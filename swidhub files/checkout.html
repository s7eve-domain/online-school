<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SwidHub – Checkout and Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--nav:#fff;--pri:#6C3CC9;--deep:#54258F;--bg:#F8F6FC;--card:#fff;--tag:#E6D9FA;--tagtx:#3b1a73;--head:#24143D;--tx:#4a3d62;--line:#e4dcf2;--ok:#1f8a4c;--bad:#b3261e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--nav:#1b1030;--bg:#140b25;--card:#201336;--tag:#3a2468;--tagtx:#e6d9fa;--head:#f1eaff;--tx:#c9bde0;--line:#35244f;--pri:#8f66ea;--ok:#52d58a;--bad:#ff8a80}}
:root[data-theme="dark"]{--nav:#1b1030;--bg:#140b25;--card:#201336;--tag:#3a2468;--tagtx:#e6d9fa;--head:#f1eaff;--tx:#c9bde0;--line:#35244f;--pri:#8f66ea;--ok:#52d58a;--bad:#ff8a80}
*{box-sizing:border-box}
body{margin:0;font-family:Poppins,system-ui,sans-serif;background:var(--bg);color:var(--tx);line-height:1.6}
h1,h2,h3{color:var(--head);line-height:1.25;margin:0 0 8px}
a{color:var(--pri)}
:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
.wrap{max-width:1120px;margin:auto;padding:0 20px}
main{padding:30px 0 70px;min-height:70vh}
.btn{display:inline-block;border:0;border-radius:999px;padding:10px 20px;font:600 .92rem Poppins,sans-serif;cursor:pointer;background:var(--pri);color:#fff;text-decoration:none}
.btn:hover{filter:brightness(.88)}
.btn.ghost{background:transparent;color:var(--pri);border:2px solid var(--pri)}
.btn.sm{padding:5px 13px;font-size:.8rem}
.btn.bad{background:var(--bad)}
.tag{display:inline-block;background:var(--tag);color:var(--tagtx);border-radius:999px;padding:2px 12px;font-size:.78rem;font-weight:500}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px}
header{position:sticky;top:0;z-index:50;background:var(--nav);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:6px;min-height:64px;flex-wrap:wrap;padding-block:4px}
.logo{background:#fff;border-radius:12px;padding:2px 6px;display:flex;margin-right:6px}
.logo img{height:40px;display:block}
.bar a.l{color:var(--head);font-weight:500;text-decoration:none;padding:6px 10px;border-radius:10px;font-size:.9rem}
.bar a.l:hover,.bar a.l.on{background:var(--tag)}
.sp{flex:1}
.icon,.bar select{background:none;border:1px solid var(--line);color:var(--head);border-radius:999px;height:36px;min-width:36px;cursor:pointer;font:inherit;font-size:.85rem;padding:0 10px;width:auto}
label{display:block;font-size:.85rem;font-weight:600;color:var(--head);margin:10px 0 4px}
input,select,textarea{width:100%;padding:9px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--head);font:inherit;font-size:.9rem}
.two{display:grid;grid-template-columns:1.6fr 1fr;gap:22px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
@media(max-width:850px){.two{grid-template-columns:1fr}}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.stat b{display:block;font-size:1.5rem;color:var(--head)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}
.tabs button{border:1px solid var(--line);background:var(--card);color:var(--head);border-radius:999px;padding:6px 16px;cursor:pointer;font:500 .85rem Poppins}
.tabs button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.bars{display:flex;align-items:end;gap:10px;height:130px;margin-bottom:26px}
.bars i{flex:1;background:var(--pri);border-radius:8px 8px 0 0;position:relative}
.bars i span{position:absolute;bottom:-22px;left:0;right:0;text-align:center;font-size:.72rem;font-style:normal}
.plan.best{border:2px solid var(--pri)}
.modal{position:fixed;inset:0;background:rgba(20,11,37,.6);display:grid;place-items:center;z-index:80;padding:16px}
.modal .card{max-width:480px;width:100%}
.ok{color:var(--ok);font-weight:600}.no{color:var(--bad);font-weight:600}
.note{background:var(--tag);color:var(--tagtx);border-radius:12px;padding:10px 14px;font-size:.85rem}
.sr{position:absolute;left:-9999px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--head);color:var(--bg);padding:10px 20px;border-radius:999px;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .2s;z-index:99}
#toast.show{opacity:1}

<script>
const $=s=>document.querySelector(s),V=$("#v");
const toast=m=>{const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(t._);t._=setTimeout(()=>t.classList.remove("show"),2600)};
const get=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},put=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ng=n=>"₦"+Math.round(n).toLocaleString();
const FEE=.4; /* platform commission on mentor sessions */
const CAT=[["c1","Excel for Work",15000],["c2","Intro to Python",9000],["c3","UX Design Foundations",25000],["c4","Digital Marketing",20000],["c5","Data Analysis with SQL",30000],["c6","IELTS Writing",12000],["s1","Session: Adaeze Okafor (1 hr)",8000],["s2","Session: Tunde Bello (1 hr)",10000]];
const COUPONS={WELCOME10:["10% off",s=>s*.1],SWID20:["20% off",s=>s*.2],NG5000:["₦5,000 off",s=>Math.min(5000,s)]};
const PLANS=[["p1","Learner Plus, monthly",5000],["p2","Learner Plus, annual",48000]];
let S={cart:get("p_cart",[]),coupon:get("p_coupon",""),orders:get("p_orders",[]),admin:get("p_admin",0),tab:"Overview",
users:get("p_users",[["Chioma Eze","Learner","Active"],["Adaeze Okafor","Mentor","Active"],["Tunde Bello","Mentor","Active"],["Ibrahim Sani","Learner","Active"],["Grace Adebayo","Instructor","Active"]]),
courses:get("p_courses",[["Excel for Work","Adaeze Okafor","Published"],["Intro to Python","Grace Adebayo","Published"],["Public Health Basics","Kemi Adeyemi","In review"],["Photography 101","Emeka Eze","In review"]]),
apps:get("p_apps",[["Seyi Lawal","Tech","8 yrs","Pending"],["Amaka Obi","Business","6 yrs","Pending"]]),
reps:get("p_reps",[["Dispute","Ibrahim S. says a session ended after 20 minutes",8000],["Report","Spam comment in Excel for Work forum",0]]),
blog:get("p_blog",["How to prepare for your first mentor session","5 Excel formulas every analyst uses"]),cats:get("p_cats",["Technology","Business","Data Science","Health","Arts & Design","Languages"])};
const save=()=>{put("p_cart",S.cart);put("p_coupon",S.coupon);put("p_orders",S.orders);put("p_admin",S.admin);["users","courses","apps","reps","blog","cats"].forEach(k=>put("p_"+k,S[k]))};
const sub=()=>S.cart.reduce((a,i)=>a+i[2],0),disc=()=>S.coupon&&COUPONS[S.coupon]?COUPONS[S.coupon][1](sub()):0,tot=()=>sub()-disc();
const ccount=()=>$("#cb").textContent="Cart ("+S.cart.length+")";
function add(id){const it=[...CAT,...PLANS].find(x=>x[0]==id);if(S.cart.some(x=>x[0]==id))return toast("Already in your cart");S.cart.push(it);save();ccount();toast("Added: "+it[1])}
function rm(i){S.cart.splice(i,1);save();ccount();route()}
function coupon(){const c=$("#cc").value.trim().toUpperCase();if(!COUPONS[c])return toast("That code isn’t valid. Try WELCOME10");S.coupon=c;save();toast("Coupon applied: "+COUPONS[c][0]);route()}
const P={
shop(){V.innerHTML=`<h1>Courses and sessions</h1><div class="grid">${CAT.map(c=>`<article class="card"><span class="tag">${c[0][0]=="c"?"Course":"Mentor session"}</span><h3 style="margin-top:8px">${c[1]}</h3><p><b style="color:var(--head)">${ng(c[2])}</b></p><button class="btn sm" onclick="add('${c[0]}')">Add to cart</button></article>`).join("")}</div>`},
plans(){V.innerHTML=`<h1>Learner Plus</h1><p>Unlimited access to every course, plus a monthly group Q&A with mentors.</p><div class="grid">${PLANS.map((p,i)=>`<div class="card plan ${i?"best":""}"><h2>${p[1]}</h2><h2 style="font-size:2rem">${ng(p[2])}</h2><p>${i?"Save 20% compared with paying monthly.":"Cancel any time."}</p><button class="btn" onclick="add('${p[0]}');location.hash='cart'">Subscribe</button></div>`).join("")}</div>`},
cart(){const L=S.cart.map((c,i)=>`<div class="row"><span>${c[1]}</span><span>${ng(c[2])} <button class="btn sm ghost" aria-label="Remove ${c[1]}" onclick="rm(${i})">Remove</button></span></div>`).join("");
V.innerHTML=`<h1>Your cart</h1>${S.cart.length?`<div class="two"><div class="card">${L}</div><aside class="card" style="align-self:start"><div class="row"><span>Subtotal</span><span>${ng(sub())}</span></div>${disc()?`<div class="row"><span>Coupon ${S.coupon}</span><span class="ok">−${ng(disc())}</span></div>`:""}<div class="row"><b>Total</b><b>${ng(tot())}</b></div><label for="cc">Coupon code</label><div style="display:flex;gap:8px"><input id="cc" value="${S.coupon}"><button class="btn sm" onclick="coupon()">Apply</button></div><br><a class="btn" style="width:100%;text-align:center" href="#checkout">Go to checkout</a></aside></div>`:`<p>Your cart is empty. <a href="#shop">Browse courses</a>.</p>`}`},
checkout(){if(!S.cart.length){location.hash="cart";return}V.innerHTML=`<h1>Checkout</h1><div class="two"><form class="card" id="pf"><h2>Pay with card</h2><p class="note">Demo only. Do not enter a real card. The live site uses Stripe Checkout, so card details go straight to Stripe and never touch SwidHub.</p><label for="pn">Name on card</label><input id="pn" required value="Test Learner"><label for="pe">Email for receipt</label><input id="pe" type="email" required value="learner@example.com"><label for="pc">Test card number</label><input id="pc" required value="4242 4242 4242 4242" inputmode="numeric"><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><div><label for="px">Expiry</label><input id="px" value="12 / 30" required></div><div><label for="pv">CVC</label><input id="pv" value="123" required></div></div><br><button class="btn" style="width:100%">Pay ${ng(tot())}</button><p style="text-align:center"><small>Secured by Stripe (demo)</small></p></form><aside class="card" style="align-self:start"><h2>Order summary</h2>${S.cart.map(c=>`<div class="row"><span>${c[1]}</span><span>${ng(c[2])}</span></div>`).join("")}<div class="row"><b>Total</b><b>${ng(tot())}</b></div></aside></div>`;
$("#pf").onsubmit=e=>{e.preventDefault();if($("#pc").value.replace(/\s/g,"")!="4242424242424242")return toast("Use the Stripe test card 4242 4242 4242 4242");const o={id:"SW-"+Date.now().toString().slice(-6),d:new Date().toLocaleDateString(),items:S.cart.map(c=>c[1]),total:tot(),coupon:S.coupon,sess:S.cart.filter(c=>c[0][0]=="s").reduce((a,c)=>a+c[2],0)};S.orders.unshift(o);S.cart=[];S.coupon="";save();ccount();
$("#md").innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-label="Payment received"><div class="card"><h2>Payment received ✔</h2><p>Order <b>${o.id}</b> · ${ng(o.total)}<br>A receipt would be emailed to ${esc($("#pe").value)} (needs the live backend).</p><button class="btn" onclick="$('#md').innerHTML='';location.hash='orders'">View orders</button></div></div>`}},
orders(){V.innerHTML=`<h1>Orders and receipts</h1><div class="card">${S.orders.map(o=>`<div class="row"><span><b style="color:var(--head)">${o.id}</b> · ${o.d}<br><small>${o.items.map(esc).join(", ")}${o.coupon?" · coupon "+o.coupon:""}</small></span><b>${ng(o.total)}</b></div>`).join("")||"<p>No orders yet. <a href='#shop'>Browse courses</a>.</p>"}</div>`},
admin(){if(!S.admin){V.innerHTML=`<div class="card" style="max-width:480px;margin:auto"><h1>Admin sign-in</h1><p>Demo access for reviewing the panel. The live site would require an admin account with two-step verification.</p><button class="btn" onclick="S.admin=1;save();route()">Continue as admin</button></div>`;return}
const T=["Overview","Users","Courses","Mentors","Reports","Blog","Categories"],t=S.tab,ord=S.orders.reduce((a,o)=>a+o.total,0),ses=1200000+S.orders.reduce((a,o)=>a+o.sess,0),crs=2450000+ord-S.orders.reduce((a,o)=>a+o.sess,0);
const B={Overview:`<div class="grid"><div class="card stat"><b>${ng(crs)}</b>Course and plan revenue</div><div class="card stat"><b>${ng(ses)}</b>Mentor session volume</div><div class="card stat"><b>${ng(ses*FEE)}</b>Commission (40%)</div><div class="card stat"><b>${ng(ses*(1-FEE))}</b>Mentor payouts (60%)</div></div><br><div class="card"><h2>Monthly revenue (₦000)</h2><div class="bars">${[[380,"Jun"],[450,"Jul"],[520,"Aug"],[610,"Sep"],[780,"Oct"],[920,"Nov"]].map(b=>`<i style="height:${b[0]/9.5}%" title="${b[0]}"><span>${b[1]}</span></i>`).join("")}</div></div>`,
Users:S.users.map((u,i)=>`<div class="row"><span><b style="color:var(--head)">${u[0]}</b> <span class="tag">${u[1]}</span></span><span class="${u[2]=="Active"?"ok":"no"}">${u[2]} <button class="btn sm ghost" onclick="S.users[${i}][2]=S.users[${i}][2]=='Active'?'Suspended':'Active';save();route()">${u[2]=="Active"?"Suspend":"Reinstate"}</button></span></div>`).join(""),
Courses:S.courses.map((c,i)=>`<div class="row"><span><b style="color:var(--head)">${c[0]}</b><br><small>by ${c[1]}</small></span><span><span class="tag">${c[2]}</span> <button class="btn sm" onclick="S.courses[${i}][2]=S.courses[${i}][2]=='Published'?'Unpublished':'Published';save();route()">${c[2]=="Published"?"Unpublish":"Publish"}</button></span></div>`).join(""),
Mentors:S.apps.map((a,i)=>`<div class="row"><span><b style="color:var(--head)">${a[0]}</b> · ${a[1]} · ${a[2]}<br><small>Credentials uploaded</small></span><span>${a[3]=="Pending"?`<button class="btn sm" onclick="S.apps[${i}][3]='Verified';save();route()">Approve</button> <button class="btn sm bad" onclick="S.apps[${i}][3]='Rejected';save();route()">Reject</button>`:`<span class="${a[3]=="Verified"?"ok":"no"}">${a[3]=="Verified"?"✔ ":""}${a[3]}</span>`}</span></div>`).join(""),
Reports:S.reps.map((r,i)=>`<div class="row"><span><span class="tag">${r[0]}</span> ${esc(r[1])}</span><span>${r[2]?`<button class="btn sm" onclick="resolve(${i},1)">Refund ${ng(r[2])}</button> `:""}<button class="btn sm ghost" onclick="resolve(${i},0)">Dismiss</button></span></div>`).join("")||"<p>No open reports.</p>",
Blog:`<form id="bf" style="display:flex;gap:8px"><label class="sr" for="bt">Post title</label><input id="bt" placeholder="New post title" required><button class="btn">Add post</button></form>`+S.blog.map((b,i)=>`<div class="row"><span>${esc(b)}</span><button class="btn sm ghost" onclick="S.blog.splice(${i},1);save();route()">Delete</button></div>`).join(""),
Categories:`<form id="kf" style="display:flex;gap:8px"><label class="sr" for="kt">Category</label><input id="kt" placeholder="New category" required><button class="btn">Add category</button></form>`+S.cats.map((b,i)=>`<div class="row"><span>${esc(b)}</span><button class="btn sm ghost" onclick="S.cats.splice(${i},1);save();route()">Delete</button></div>`).join("")};
V.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap"><h1>Admin panel</h1><button class="btn ghost sm" onclick="S.admin=0;save();route()">Sign out</button></div><div class="tabs" role="tablist">${T.map(x=>`<button class="${x==t?"on":""}" onclick="S.tab='${x}';route()">${x}</button>`).join("")}</div>${t=="Overview"?B[t]:`<div class="card">${B[t]}</div>`}`;
if($("#bf"))$("#bf").onsubmit=e=>{e.preventDefault();S.blog.unshift($("#bt").value);save();route()};if($("#kf"))$("#kf").onsubmit=e=>{e.preventDefault();S.cats.push($("#kt").value);save();route()}}};
function resolve(i,r){const x=S.reps.splice(i,1)[0];save();toast(r?"Refund issued (demo)":"Report dismissed");route()}
$("#th").onclick=()=>{const r=document.documentElement,d=r.dataset.theme?r.dataset.theme=="dark":matchMedia("(prefers-color-scheme:dark)").matches;r.dataset.theme=d?"light":"dark"};
function route(){const h=location.hash.slice(1)||"shop";document.querySelectorAll(".bar a.l").forEach(a=>a.classList.toggle("on",a.hash=="#"+h));ccount();(P[h]||P.shop)()}
addEventListener("hashchange",()=>{$("#md").innerHTML="";route();scrollTo(0,0)});route();
</script></body></html>
