<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SwidHub – Learn, track and teach</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--nav:#fff;--pri:#6C3CC9;--deep:#54258F;--bg:#F8F6FC;--card:#fff;--tag:#E6D9FA;--tagtx:#3b1a73;--head:#24143D;--tx:#4a3d62;--line:#e4dcf2;--ok:#1f8a4c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--nav:#1b1030;--bg:#140b25;--card:#201336;--tag:#3a2468;--tagtx:#e6d9fa;--head:#f1eaff;--tx:#c9bde0;--line:#35244f;--pri:#8f66ea;--ok:#52d58a}}
:root[data-theme="dark"]{--nav:#1b1030;--bg:#140b25;--card:#201336;--tag:#3a2468;--tagtx:#e6d9fa;--head:#f1eaff;--tx:#c9bde0;--line:#35244f;--pri:#8f66ea;--ok:#52d58a}
*{box-sizing:border-box}
body{margin:0;font-family:Poppins,system-ui,sans-serif;background:var(--bg);color:var(--tx);line-height:1.6}
h1,h2,h3{color:var(--head);line-height:1.25;margin:0 0 8px}
a{color:var(--pri)}
:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
.wrap{max-width:1100px;margin:auto;padding:0 20px}
main{padding:32px 0 70px;min-height:70vh}
.btn{display:inline-block;border:0;border-radius:999px;padding:10px 20px;font:600 .92rem Poppins,sans-serif;cursor:pointer;background:var(--pri);color:#fff;text-decoration:none}
.btn:hover{filter:brightness(.88)}
.btn.ghost{background:transparent;color:var(--pri);border:2px solid var(--pri)}
.btn.sm{padding:6px 14px;font-size:.82rem}
.tag{display:inline-block;background:var(--tag);color:var(--tagtx);border-radius:999px;padding:2px 12px;font-size:.78rem;font-weight:500}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px}
header{position:sticky;top:0;z-index:50;background:var(--nav);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:12px;height:64px}
.logo{background:#fff;border-radius:12px;padding:2px 6px;display:flex}
.logo img{height:42px;display:block}
.bar a.l{color:var(--head);font-weight:500;text-decoration:none;padding:6px 10px;border-radius:10px}
.bar a.l:hover{background:var(--tag)}
.sp{flex:1}
.icon{background:none;border:1px solid var(--line);color:var(--head);border-radius:999px;height:38px;min-width:38px;cursor:pointer}
label{display:block;font-size:.85rem;font-weight:600;color:var(--head);margin:12px 0 4px}
input,select,textarea{width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--head);font:inherit}
.auth{max-width:440px;margin:20px auto}
.roles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.roles label{margin:0;border:2px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center;cursor:pointer;font-weight:500;font-size:.85rem}
.roles input{position:absolute;opacity:0;width:1px}
.roles input:checked+span{color:var(--pri);font-weight:700}
.roles label:has(input:checked){border-color:var(--pri);background:var(--tag)}
.err{color:#c0392b;font-size:.85rem;min-height:1.2em}
.two{display:grid;grid-template-columns:2fr 1fr;gap:24px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
@media(max-width:800px){.two{grid-template-columns:1fr}}
.prog{height:9px;border-radius:9px;background:var(--tag);overflow:hidden}
.prog i{display:block;height:100%;background:var(--pri);transition:width .3s}
details{border-bottom:1px solid var(--line);padding:10px 0}
summary{cursor:pointer;font-weight:600;color:var(--head)}
.player{aspect-ratio:16/9;border-radius:18px;background:linear-gradient(150deg,#24143D,#54258F);display:grid;place-items:center;color:#fff;text-align:center;padding:16px}
.lessons button{display:flex;gap:10px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:11px 4px;color:var(--head);font:500 .9rem Poppins;cursor:pointer}
.lessons button.on{color:var(--pri);font-weight:700}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:18px 0 12px}
.tabs button{border:1px solid var(--line);background:var(--card);color:var(--head);border-radius:999px;padding:6px 16px;cursor:pointer;font:500 .85rem Poppins}
.tabs button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.stat b{display:block;font-size:1.6rem;color:var(--head)}
.bars{display:flex;align-items:end;gap:10px;height:120px}
.bars i{flex:1;background:var(--pri);border-radius:8px 8px 0 0;position:relative}
.bars i span{position:absolute;bottom:-22px;left:0;right:0;text-align:center;font-size:.72rem;font-style:normal;color:var(--tx)}
.cert{border:6px double var(--pri);border-radius:18px;padding:30px;text-align:center;background:var(--card)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--head);color:var(--bg);padding:10px 20px;border-radius:999px;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .2s;z-index:99}
#toast.show{opacity:1}
@media print{header,.noprint{display:none}}

$("#f").onsubmit=e=>{e.preventDefault();const u=get("sw_acc",{})[$("#e").value];user=u||{name:$("#e").value.split("@")[0],email:$("#e").value,role:"Learner"};set("sw_user",user);location.hash=user.role=="Instructor"?"instructor":"dash"}},
reset(){V.innerHTML=`<form class="card auth" id="f"><h1>Reset password</h1><p>Enter your email and we’ll send a reset link.</p><label for="e">Email</label><input id="e" type="email" required><br><br><button class="btn">Send reset link</button> <a href="#login">Back</a></form>`;$("#f").onsubmit=e=>{e.preventDefault();toast("If that account exists, a link is on its way (demo)");location.hash="login"}},
signup(){V.innerHTML=`<form class="card auth" id="f"><h1>Join SwidHub</h1><label for="n">Full name</label><input id="n" required autocomplete="name"><label for="e">Email</label><input id="e" type="email" required><label for="p">Password (6+ characters)</label><input id="p" type="password" required minlength="6" autocomplete="new-password"><label>I want to join as</label><div class="roles">${["Learner","Instructor","Mentor"].map((r,i)=>`<label><input type="radio" name="r" value="${r}" ${i?"":"checked"}><span>${r}</span></label>`).join("")}</div><br><button class="btn" style="width:100%">Create account</button><button type="button" class="btn ghost" style="width:100%;margin-top:8px" onclick="social('Google')">Sign up with Google</button><p>Have an account? <a href="#login">Log in</a></p></form>`;
$("#f").onsubmit=e=>{e.preventDefault();user={name:$("#n").value,email:$("#e").value,role:document.querySelector("[name=r]:checked").value};const a=get("sw_acc",{});a[user.email]=user;set("sw_acc",a);set("sw_user",user);toast("Welcome, "+user.name);location.hash=user.role=="Instructor"?"instructor":"dash"}},
course(){V.innerHTML=`<div class="two"><div><span class="tag">Business</span><h1 style="font-size:2rem;margin-top:8px">Excel for Work: From Basics to Dashboards</h1><p>Build spreadsheets you can trust. Learn formulas, tables, charts and pivot tables through short, practical lessons.</p><p>★ 4.8 (2,140 reviews) · 12,300 learners · Beginner · 69 min of video</p>
<h2>What you’ll learn</h2><ul><li>Write formulas without copy-paste errors</li><li>Summarize data with pivot tables</li><li>Present results in clear charts</li></ul>
<h2>Syllabus</h2>${LES.map((l,i)=>`<details><summary>Module ${i+1}: ${l[0]}</summary><p>${l[1]} video, one short quiz and a downloadable worksheet.</p></details>`).join("")}
<h2 style="margin-top:22px">Requirements</h2><p>A laptop or phone with a spreadsheet app. No prior experience needed.</p>
<h2>Your instructor</h2><div class="card" style="display:flex;gap:14px;align-items:center"><div class="tag" style="padding:14px 18px;font-size:1rem">AO</div><div><b style="color:var(--head)">Adaeze Okafor</b><br>Finance analyst and trainer with 9 years of experience.</div></div>
<h2 style="margin-top:22px">Reviews</h2><div class="card">“Short lessons, real files. I used the pivot table lesson at work the next day.” <b>Chioma E.</b> ★★★★★</div><br><div class="card">“Quizzes after each module kept me honest.” <b>Ibrahim S.</b> ★★★★☆</div></div>
<aside class="card" style="align-self:start;position:sticky;top:84px"><h2>₦15,000</h2><p><small>Includes certificate of completion</small></p><button class="btn" style="width:100%" onclick="enroll()">${enrolled?"Continue learning":"Enroll now"}</button><br><br><button class="btn ghost" style="width:100%" onclick="location.href='mentors.html'">Book a mentor for this course</button><p><small>Enrolling here is a free demo. Paid checkout is on the cart page.</small></p></aside></div>`},
learn(){if(!guard())return;const cur=+(get("sw_cur",0));V.innerHTML=`<div class="two"><div><h1>Excel for Work</h1><div class="player" id="pl"><div><div style="font-size:3rem">▶</div><b>${LES[cur][0]}</b><br>${LES[cur][1]} · sample video placeholder</div></div><br><button class="btn" onclick="finish(${cur})">${done.includes(cur)?"Completed ✔":"Mark lesson complete"}</button>
<div class="tabs" id="tb">${["Notes","Quiz","Resources","Discussion"].map((t,i)=>`<button class="${i?"":"on"}" onclick="tab(${i})">${t}</button>`).join("")}</div><div class="card" id="tc"></div></div>
<aside><div class="card"><b style="color:var(--head)">${pct()}% complete</b><div class="prog" role="progressbar" aria-valuenow="${pct()}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct()}%"></i></div><div class="lessons">${LES.map((l,i)=>`<button class="${i==cur?"on":""}" onclick="set('sw_cur',${i});views.learn()"><span>${done.includes(i)?"✔":"○"}</span>${l[0]}</button>`).join("")}</div></div>${pct()==100?`<br><a class="btn" style="width:100%;text-align:center" href="#certs">View certificate</a>`:""}</aside></div>`;tab(0)},
dash(){if(!guard())return;if(user.role=="Instructor")return views.instructor();V.innerHTML=`<h1>Hi ${esc(user.name)}</h1><p>Your learning at a glance.</p><div class="grid"><div class="card stat"><b>${enrolled?1:0}</b>Enrolled courses</div><div class="card stat"><b>${pct()}%</b>Average progress</div><div class="card stat"><b>${pct()==100?1:0}</b>Certificates</div><div class="card stat"><b>1</b>Upcoming session</div></div><br>
<div class="grid"><div class="card"><h2>My courses</h2>${enrolled?`<div class="row"><span>Excel for Work</span><span>${pct()}%</span></div><div class="prog"><i style="width:${pct()}%"></i></div><br><a class="btn sm" href="#learn">Continue</a>`:`<p>You haven’t enrolled yet.</p><a class="btn sm" href="#course">Browse courses</a>`}</div>
<div class="card"><h2>Upcoming mentor sessions</h2><div class="row"><span>Tunde Bello · Data career chat</span><span class="tag">Fri 4:00 PM</span></div><p><small>Sample data. Live booking arrives in Phase 3.</small></p></div>
<div class="card"><h2 id="certs">Certificates</h2>${pct()==100?`<div class="cert"><small>Certificate of completion</small><h2>${esc(user.name)}</h2><p>completed <b>Excel for Work</b> on SwidHub</p></div><br><button class="btn sm noprint" onclick="print()">Print or save as PDF</button>`:`<p>Finish all lessons to earn your certificate.</p>`}</div>
<div class="card"><h2>Saved courses</h2><div class="row"><span>Intro to Python</span><span>₦9,000</span></div><div class="row"><span>UX Design Foundations</span><span>₦25,000</span></div></div>
<div class="card"><h2>Messages</h2><div class="row"><span><b>Adaeze:</b> Welcome to the course!</span></div><div class="row"><span><b>Support:</b> Your account is ready.</span></div></div></div>`},
certs(){views.dash();setTimeout(()=>document.getElementById("certs")?.scrollIntoView(),50)},
instructor(){if(!guard())return;V.innerHTML=`<h1>Instructor dashboard</h1><div class="grid"><div class="card stat"><b>₦184,500</b>Earnings this month</div><div class="card stat"><b>312</b>Active students</div><div class="card stat"><b>${myCourses.length}</b>Courses</div><div class="card stat"><b>4.8</b>Avg rating</div></div><br>
<div class="two"><div class="card"><h2>Create a course</h2><form id="cf"><label for="ct">Title</label><input id="ct" required><label for="cc">Category</label><select id="cc"><option>Technology</option><option>Business</option><option>Data Science</option><option>Languages</option></select><label for="cp">Price (₦, 0 for free)</label><input id="cp" type="number" min="0" value="0"><label for="cv">Lesson video</label><input id="cv" type="file" accept="video/*"><br><br><button class="btn">Save as draft</button></form></div>
<div class="card"><h2>Earnings (₦000)</h2><div class="bars" style="margin-bottom:30px">${[[60,"Jun"],[85,"Jul"],[70,"Aug"],[110,"Sep"],[140,"Oct"],[185,"Nov"]].map(b=>`<i style="height:${b[0]/1.9}%" title="${b[0]}"><span>${b[1]}</span></i>`).join("")}</div></div></div><br>
<div class="card"><h2>My courses</h2>${myCourses.map((c,i)=>`<div class="row"><span>${esc(c[0])}</span><span><span class="tag">${c[2]}</span> <button class="btn sm ghost" onclick="pub(${i})">${c[2]=="Draft"?"Publish":"Unpublish"}</button></span></div>`).join("")}</div>`;
$("#cf").onsubmit=e=>{e.preventDefault();const f=$("#cv").files[0];myCourses.push([$("#ct").value,+$("#cp").value,"Draft"]);set("sw_my",myCourses);toast("Draft saved"+(f?" with video "+f.name:""));views.instructor()}}
};
function pub(i){myCourses[i][2]=myCourses[i][2]=="Draft"?"Published":"Draft";set("sw_my",myCourses);views.instructor()}
function enroll(){if(!user){toast("Log in to enroll");location.hash="signup";return}enrolled=true;set("sw_enr",true);location.hash="learn"}
function finish(i){if(!done.includes(i)){done.push(i);set("sw_done",done);toast(pct()==100?"Course complete! Certificate unlocked":"Lesson complete")}views.learn()}
function tab(i){document.querySelectorAll("#tb button").forEach((b,j)=>b.classList.toggle("on",i==j));const c=$("#tc");
if(i==0){c.innerHTML=`<label for="nt">Your notes (saved automatically)</label><textarea id="nt" rows="5">${esc(notes)}</textarea>`;$("#nt").oninput=e=>{notes=e.target.value;set("sw_notes",notes)}}
if(i==1){c.innerHTML=QZ.map((q,n)=>`<fieldset style="border:0;padding:0;margin:0 0 12px"><legend><b style="color:var(--head)">${n+1}. ${q[0]}</b></legend>${q[1].map((o,k)=>`<label style="font-weight:400"><input type="radio" name="q${n}" value="${k}" style="width:auto"> ${o}</label>`).join("")}</fieldset>`).join("")+`<button class="btn sm" onclick="grade()">Check answers</button> <b id="gr"></b>`}
if(i==2){c.innerHTML=["Lesson worksheet.xlsx","Formula cheat sheet.pdf","Practice data.csv"].map(f=>`<div class="row"><span>📄 ${f}</span><button class="btn sm ghost" onclick="toast('Sample file: downloads need the live backend')">Download</button></div>`).join("")}
if(i==3){c.innerHTML=`<div id="ps">${posts.map(p=>`<div class="row"><span>${esc(p)}</span></div>`).join("")}</div><label for="np">Add a comment</label><textarea id="np" rows="2"></textarea><br><br><button class="btn sm" onclick="post()">Post comment</button>`}}
function grade(){let s=0;QZ.forEach((q,n)=>{const c=document.querySelector(`[name=q${n}]:checked`);if(c&&+c.value==q[2])s++});$("#gr").textContent=`Score: ${s}/${QZ.length}`}
function post(){const v=$("#np").value.trim();if(!v)return toast("Write a comment first");posts.push((user?user.name:"You")+": "+v);set("sw_posts",posts);tab(3)}
$("#th").onclick=()=>{const r=document.documentElement,d=r.dataset.theme?r.dataset.theme=="dark":matchMedia("(prefers-color-scheme:dark)").matches;r.dataset.theme=d?"light":"dark"};
function social(n){user={name:n+" user",email:"user@"+n.toLowerCase()+".com",role:"Learner"};set("sw_user",user);toast("Signed in with "+n+" (demo)");location.hash="dash"}
function route(){head();const h=location.hash.slice(1)||"course";(views[h]||views.course)();window.scrollTo(0,0)}
addEventListener("hashchange",route);route();
</script></body></html>
